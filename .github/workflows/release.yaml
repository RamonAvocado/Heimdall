name: Release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write
  issues: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, needed for the changelog
      - uses: astral-sh/setup-uv@v6
      - name: Tag and release if the version changed
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          tag=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi

          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## Commits"
            git log --no-merges --pretty='- %s (%h)' ${prev:+"$prev"..}HEAD
            if [ -n "$prev" ]; then
              since=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$prev")
              echo
              echo "## Issues resolved"
              gh issue list --state closed --limit 200 \
                --search "closed:>$since reason:completed" \
                --json number,title --jq '.[] | "- #\(.number) \(.title)"'
            fi
          } > notes.md

          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes-file notes.md --generate-notes

          # The docs (Yggdrasil) render catalog.json as Heimdall's reference
          # pages and open a PR with it when they receive the dispatch.
          uv run --extra all scripts/export_catalog.py > catalog.json
          gh release upload "$tag" catalog.json --clobber
          GH_TOKEN="$DOCS_TOKEN" gh api repos/RamonAvocado/Yggdrasil/dispatches \
            -f event_type=catalog \
            -f 'client_payload[package]=heimdall' \
            -f "client_payload[tag]=$tag"
