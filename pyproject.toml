[project]
name = "heimdall-mimird"
version = "0.6.0"
description = "A data-provider SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.44.1",
    "ramonavocado-logger>=0.1.3",
]

[project.optional-dependencies]
fred = ["httpx>=0.27"]
sp500 = ["httpx>=0.27"]
yfinance = ["yfinance>=0.2.40", "pyarrow>=15"]
sec_form4 = ["httpx>=0.27"]
testing = ["pytest>=8.2"]
all = ["httpx>=0.27", "yfinance>=0.2.40", "pyarrow>=15"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heimdall"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "sandbox"]
extend-exclude = ["sandbox/scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "RUF022"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src/heimdall"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["ramonavocado_logger.*", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=heimdall --cov-report=term-missing"
markers = [
    "network: test hits a real external service (deselect with '-m \"not network\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
